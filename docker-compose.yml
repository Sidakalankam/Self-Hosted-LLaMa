services:
  vllm-worker:
    image: sidakalankam1103/self-hosted-llama-vllm-worker:v2

    container_name: vllm-worker

    environment:
      MODEL_NAME: llama-3.1-8b-instruct
      MODEL_BUCKET: personal-llm-registry

    volumes:
      - /mnt/models:/models

    ports:
      - "8000:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - vllm-worker

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus