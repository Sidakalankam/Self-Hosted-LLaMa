services:
  vllm-worker:
    image: sidakalankam1103/self-hosted-llama-vllm-worker:v2
    container_name: vllm-worker
    restart: unless-stopped

    environment:
      # Model registry configuration
      MODEL_NAME: qwen3-30b-a3b-instruct-2507-gptq-int4
      MODEL_BUCKET: personal-llm-registry

      # vLLM configuration
      MAX_MODEL_LEN: 4096
      GPU_MEMORY_UTILIZATION: 0.90
      DTYPE: auto

      # Optional.
      # Leave empty to let vLLM detect quantization from config.json.
      QUANTIZATION: ""

      # Server configuration
      PORT: 8000

      # Persistent model storage
      MODEL_ROOT: /models

    volumes:
      - /mnt/models:/models

    ports:
      - "8000:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]