services:
  vllm-worker:
    image: sidakalankam1103/self-hosted-llama-vllm-worker:v2
    container_name: vllm-worker
    restart: unless-stopped

    environment:
      MODEL_NAME: qwen3-30b-a3b-instruct-2507-gptq-int4

      # Model source: local or s3
      MODEL_SOURCE: local

      # vLLM configuration
      MAX_MODEL_LEN: 4096
      GPU_MEMORY_UTILIZATION: 0.90
      DTYPE: auto

      # Empty = let vLLM auto-detect from model config
      QUANTIZATION: ""

      PORT: 8000
      MODEL_ROOT: /models

    volumes:
      - /mnt/models:/models

    ports:
      - "8000:8000"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]