name: Build vLLM worker

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "vllm-worker/**"
      - ".github/workflows/build-vllm-worker.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vLLM worker
        uses: docker/build-push-action@v6
        with:
          context: ./vllm-worker
          file: ./vllm-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-vllm-worker:v2
