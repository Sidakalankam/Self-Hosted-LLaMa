name: Build RAG service

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "rag-service/**"
      - ".github/workflows/build-rag-service.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push RAG service
        uses: docker/build-push-action@v6
        with:
          context: ./rag-service
          file: ./rag-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-rag-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/self-hosted-llama-rag-service:v1
